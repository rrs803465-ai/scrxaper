<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Scrxaper</title>
  <link rel="icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/calls.css">
  <link rel="stylesheet" href="/css/social.css">
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/polish.css">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><img src="/logo.png" alt="" width="64" height="64"></div>

  <main id="setup" class="setup" hidden></main>

  <main id="auth" hidden>
    <header class="hero"><img src="/brand/hero-glass.png" alt="Scrxaper. Connect freely. Belong anywhere." width="1254" height="423" fetchpriority="high"></header>
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title" class="sr-only">Scrxaper</h1>
      <div class="seg auth-seg" role="tablist" aria-label="Account">
        <button type="button" class="seg-b on" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="seg-b" id="tab-signup" role="tab" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="24" autocapitalize="none" spellcheck="false"></label>
        <label id="display-field" hidden>Display name <input name="displayName" maxlength="40" autocomplete="nickname"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <p id="auth-error" class="error" role="alert"></p>
        <button class="primary wide" type="submit">Log in</button>
      </form>
      <div id="google-box" class="google-box" hidden>
        <div class="or"><span>or</span></div>
        <button class="google-btn wide" id="google-btn" type="button"><svg class="g-logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.500-.2-2.200H12v4.200h6.200a5.300 5.300 0 01-2.300 3.500v2.900h3.700c2.200-2 3.400-5 3.400-8.400z"/><path fill="#34A853" d="M12 24c3.100 0 5.700-1 7.600-2.800l-3.700-2.900c-1 .7-2.300 1.100-3.900 1.100-3 0-5.500-2-6.400-4.800H1.800v3C3.700 21.400 7.600 24 12 24z"/><path fill="#FBBC05" d="M5.600 14.600a7.200 7.200 0 010-4.600v-3H1.800a12 12 0 000 10.600z"/><path fill="#EA4335" d="M12 4.800c1.700 0 3.200.6 4.400 1.700l3.300-3.300C17.700 1.200 15.100 0 12 0 7.600 0 3.700 2.600 1.800 6.400l3.800 3c.9-2.800 3.400-4.600 6.400-4.600z"/></svg><span>Continue with Google</span></button>
      </div>
      <a class="auth-back" href="/">Back to the home page</a>
    </section>
  </main>

  <div id="app" hidden>
    <nav id="servers" class="servers" aria-label="Spaces"></nav>
    <aside id="side" class="side" aria-label="Conversations"></aside>
    <section id="main" class="main" aria-label="Conversation"></section>
    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
  </div>

  <div id="overlays"></div>
  <div id="layer"></div>
  <div id="pill" class="pill" hidden role="status" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
