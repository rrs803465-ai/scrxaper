<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Scrxaper</title>
  <link rel="icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/calls.css">
  <link rel="stylesheet" href="/css/social.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true"><img src="/logo.png" alt="" width="64" height="64"></div>

  <main id="auth" hidden>
    <header class="hero"><img src="/brand/hero-glass.png" alt="Scrxaper. Connect freely. Belong anywhere." width="1254" height="423" fetchpriority="high"></header>
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title" class="sr-only">Scrxaper</h1>
      <div class="seg auth-seg" role="tablist" aria-label="Account">
        <button type="button" class="seg-b on" id="tab-login" role="tab" aria-selected="true">Log in</button>
        <button type="button" class="seg-b" id="tab-signup" role="tab" aria-selected="false">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label>Username <input name="username" autocomplete="username" required minlength="3" maxlength="24" autocapitalize="none" spellcheck="false"></label>
        <label id="display-field" hidden>Display name <input name="displayName" maxlength="40" autocomplete="nickname"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
        <p id="auth-error" class="error" role="alert"></p>
        <button class="primary wide" type="submit">Log in</button>
      </form>
      <a class="auth-back" href="/">Back to the home page</a>
    </section>
  </main>

  <div id="app" hidden>
    <nav id="servers" class="servers" aria-label="Spaces"></nav>
    <aside id="side" class="side" aria-label="Conversations"></aside>
    <section id="main" class="main" aria-label="Conversation"></section>
    <nav id="tabbar" class="tabbar" aria-label="Primary"></nav>
  </div>

  <div id="overlays"></div>
  <div id="layer"></div>
  <div id="pill" class="pill" hidden role="status" aria-live="polite"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
