name: Android app

# Builds the Scrxaper Android app (APK).
#  - Run it by hand: Actions tab, "Android app", Run workflow, and type your server address.
#  - Or push a tag such as v1.0.0 and the APK is attached to a GitHub Release.
# For an APK that can be updated in place, add the four signing secrets described in android/README.md.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your Scrxaper address, for example https://chat.example.com"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check server address
        run: |
          if [ -z "$SERVER_URL" ]; then echo "::warning::No server address given. The app will ask for it on first launch."; fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/scrxaper.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/scrxaper.jks"
          gradle -p android assembleRelease -PserverUrl="$SERVER_URL" -PversionCode="${{ github.run_number }}" -PversionName="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk scrxaper.apk

      - name: Build debug APK (no signing secrets set)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          gradle -p android assembleDebug -PserverUrl="$SERVER_URL" -PversionCode="${{ github.run_number }}" -PversionName="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk scrxaper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scrxaper-apk
          path: scrxaper.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scrxaper.apk
