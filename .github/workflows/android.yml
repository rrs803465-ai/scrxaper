name: Android app

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Your Scrxaper address, for example https://chat.example.com"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/scrxaper.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/scrxaper.jks"
          gradle -p android assembleRelease -PserverUrl="$SERVER_URL" -PversionCode="${{ github.run_number }}" -PversionName="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk scrxaper.apk

      - name: Build debug APK (no signing secrets set)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          gradle -p android assembleDebug -PserverUrl="$SERVER_URL" -PversionCode="${{ github.run_number }}" -PversionName="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk scrxaper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scrxaper-apk
          path: scrxaper.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scrxaper.apk
